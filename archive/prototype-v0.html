<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM + ИИ</title>
<style>
:root{--bg:#f4f5f9;--c:#fff;--t:#1d2433;--m:#6b7280;--a:#4f46e5;--b:#e5e7eb;--gr:#16a34a;--rd:#dc2626}
body.dark{--bg:#000;--c:#0e0e11;--t:#eceff4;--m:#8a93a6;--b:#24272f;color-scheme:dark}body.dark #ts{border:1px solid #444}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
nav{width:200px;background:var(--c);border-right:1px solid var(--b);padding:12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
nav b{font-size:17px;margin:4px 8px 10px}nav a{padding:9px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}nav a.on,nav a:hover{background:var(--a);color:#fff}nav small{margin-top:auto;color:var(--m)}
main{flex:1;padding:18px;max-width:1000px;min-width:0}h2{margin:0 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select,textarea,button{font:inherit;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
textarea{width:100%;resize:vertical}label{display:block;margin:8px 0;color:var(--m)}label input,label select{width:100%;display:block;margin-top:3px}label.ck{display:flex;gap:8px;align-items:center}label.ck input{width:auto;margin:0}
button{background:var(--a);color:#fff;border:0;cursor:pointer}button.g{background:var(--b);color:var(--t)}button.d{background:var(--rd)}
.r{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.r input,.r select{flex:1;min-width:120px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.k,.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px}.k small,.mu{color:var(--m)}.k h3{margin:4px 0 0;font-size:19px}.gr{color:var(--gr)}.rd{color:var(--rd)}
table{width:100%;border-collapse:collapse;background:var(--c);border-radius:12px;overflow:hidden}td,th{padding:8px;border-bottom:1px solid var(--b);text-align:left}tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
.bd{color:#fff;padding:2px 8px;border-radius:10px;font-size:12px}
.bars{display:flex;gap:12px;align-items:flex-end;height:140px;margin:10px 0}.bars div{flex:1;text-align:center;font-size:11px;color:var(--m)}.bars span{display:inline-block;width:35%;margin:0 1px;border-radius:4px 4px 0 0;vertical-align:bottom}
.bx{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;min-height:80px;max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:7px 10px;border-radius:12px;background:var(--b);white-space:pre-wrap}.m small{display:block;font-size:10px;color:var(--m)}.m.a,.m.m{align-self:flex-end;background:var(--a);color:#fff}.m.a small,.m.m small{color:#ddd}
dialog{border:0;border-radius:14px;width:min(460px,94vw);background:var(--c);color:var(--t)}dialog::backdrop{background:#0008}
#ts{position:fixed;bottom:16px;left:50%;transform:translate(-50%,80px);background:#111;color:#fff;padding:9px 16px;border-radius:20px;transition:.3s;z-index:9}#ts.on{transform:translate(-50%,0)}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;flex-direction:row;overflow-x:auto;position:static}nav b,nav small{display:none}}
@media print{nav,button,.r{display:none}}
nav a{transition:.15s}nav a.on{box-shadow:0 4px 12px #4f46e555}
.k,.card{box-shadow:0 1px 3px #0001}.k{position:relative;overflow:hidden}.k:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--a)}
.dn{width:120px;height:120px;border-radius:50%;flex:none;position:relative}.dn:after{content:"";position:absolute;inset:28px;background:var(--c);border-radius:50%}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.hb i{display:block;height:10px;border-radius:5px;min-width:3px}.hb span:first-child{width:90px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}.sc{margin:6px 0;cursor:pointer}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto}.kb>div{background:var(--bg);border:1px solid var(--b);border-radius:12px;padding:8px;min-height:120px}.kb .it{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:8px;margin:6px 0;cursor:grab}
button:hover{filter:brightness(1.12)}main{animation:fi .3s}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
</style></head>
<body><nav id="nv"></nav><main id="mn"></main><dialog id="dl"></dialog><div id="ts"></div>
<script>
const DEF={prov:'openai',url:'https://api.openai.com/v1/chat/completions',model:'gpt-4o-mini',key:'',tg:'',temp:.7,cur:'₸',prompt:'',rules:'',faq:'',auto:true,off:0,tok:0,tokPrice:0,subName:'Подписка ИИ',subAmt:0,dark:matchMedia('(prefers-color-scheme:dark)').matches,kPhone:'',kLink:'',kUrl:'',kKey:'',srv:'',srvKey:''};
let D={clients:[],msgs:{},fin:[],inv:[],ask:[],cfg:{...DEF}},tab='dash',per='',q='',sf='',cur='',poll=false;
try{const s=JSON.parse(localStorage.getItem('crm'));if(s)D={...D,...s,cfg:{...DEF,...s.cfg}}}catch(e){}
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{D.cfg.srv&&sync();try{localStorage.setItem('crm',JSON.stringify(D))}catch(e){toast('Память полна: сделайте экспорт и удалите старые чеки')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),pad=n=>String(n).padStart(2,'0');
const td=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const M=n=>Math.round(n||0).toLocaleString('ru-RU')+' '+D.cfg.cur,sum=a=>a.reduce((t,x)=>t+ +x.amt,0),sleep=t=>new Promise(r=>setTimeout(r,t));
const ST=['Новый','В работе','Переговоры','Оплачен','Отказ'],SC={'Новый':'#6366f1','В работе':'#f59e0b','Переговоры':'#0ea5e9','Оплачен':'#16a34a','Отказ':'#9ca3af'};
const CAT=['Продажа','Предоплата','Подписка ИИ','Токены API','Реклама','Зарплата','Налоги','Прочее'];
const T=[['dash','📊 Дашборд'],['cl','👥 Клиенты'],['chat','💬 Диалоги'],['ask','🔎 Спросить ИИ'],['ai','🤖 Настройка ИИ'],['fin','💰 Бухгалтерия'],['set','🔌 Подключения']];
function toast(t){const e=$('#ts');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',3500)}
const S=(k,v)=>{D.cfg[k]=v;save()},go=t=>{tab=t;R()};
const nm=id=>{const c=D.clients.find(x=>x.id==id);return c?c.name||c.tg||'Без имени':''};
function R(){document.body.className=D.cfg.dark?'dark':'';
$('#nv').innerHTML='<b>CRM·ИИ</b>'+T.map(([k,n])=>`<a class="${k==tab?'on':''}" onclick="go('${k}')">${n}</a>`).join('')+`<a onclick="S('dark',!D.cfg.dark);R()">${D.cfg.dark?'☀️ Светлая':'🌙 Чёрная'} тема</a><small>${poll?'🟢 Telegram онлайн':'⚪ Telegram выкл'}</small>`;
$('#mn').innerHTML=V[tab]();const b=$('#bx');if(b)b.scrollTop=1e9}
const perSel=()=>{const ms=[...new Set(D.fin.map(x=>x.date.slice(0,7)).concat(td().slice(0,7)))].sort().reverse();return `<select onchange="per=this.value;R()"><option value="">Всё время</option>${ms.map(m=>`<option ${m==per?'selected':''}>${m}</option>`).join('')}</select>`};

function dash(){
const f=D.fin.filter(x=>!per||x.date.startsWith(per)),I=f.filter(x=>x.type=='in'),O=f.filter(x=>x.type=='out'),inc=sum(I),out=sum(O),ai=sum(O.filter(x=>/ИИ|токен/i.test(x.cat))),
paid=D.clients.filter(c=>c.status=='Оплачен').length,n=D.clients.length,k=(a,b,c='')=>`<div class="k"><small>${a}</small><h3 class="${c}">${b}</h3></div>`,
ms=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return d.getFullYear()+'-'+pad(d.getMonth()+1)}),
bi=ms.map(m=>[m,sum(D.fin.filter(x=>x.type=='in'&&x.date.startsWith(m))),sum(D.fin.filter(x=>x.type=='out'&&x.date.startsWith(m)))]),mx=Math.max(1,...bi.flatMap(x=>[x[1],x[2]])),
due=D.clients.filter(c=>c.next&&c.next<=td()&&c.status!='Оплачен'&&c.status!='Отказ');
return `<h2>Дашборд ${perSel()}<button onclick="D.ask=(D.ask||[]).concat({r:'u',t:'Сделай сводку: итоги, риски, кому написать сегодня'});askRun()">🤖 Сводка дня</button></h2><div class="g3">${k('Выручка',M(inc),'gr')}${k('Расходы',M(out),'rd')}${k('Прибыль',M(inc-out),inc>=out?'gr':'rd')}${k('Расход на ИИ',M(ai))}${k('Выручка / расход на ИИ',ai?(inc/ai).toFixed(1)+'×':'—')}${k('Клиентов / оплатили',n+' / '+paid+(n?' ('+Math.round(paid/n*100)+'%)':''))}${k('Токенов ИИ (оценка '+M(D.cfg.tok/1e6*D.cfg.tokPrice)+')',D.cfg.tok.toLocaleString('ru-RU'))}${k('Средний чек',M(I.length?inc/I.length:0))}</div>
<div class="card"><b>Последние 6 месяцев</b> <span class="mu">(зелёный — приход, красный — расход)</span><div class="bars">${bi.map(x=>`<div><span style="height:${x[1]/mx*110}px;background:var(--gr)"></span><span style="height:${x[2]/mx*110}px;background:var(--rd)"></span><br>${x[0].slice(2)}</div>`).join('')}</div></div>
<div class="card" style="margin-top:12px"><b>⏰ Пора связаться (${due.length})</b>${due.map(c=>`<div class="r"><a onclick="ecl('${c.id}')" style="cursor:pointer">${E(c.name)} — ${c.next}</a></div>`).join('')||'<p class="mu">Нет напоминаний</p>'}</div>${charts(f,O)}`}

let kv=0;const lst=()=>kv?board():lst0();const lst0=()=>{const l=D.clients.filter(c=>(!sf||c.status==sf)&&[c.name,c.phone,c.tg,c.note,c.src].join(' ').toLowerCase().includes(q.toLowerCase()));
return `<table><tr><th>Имя</th><th>Телефон</th><th>Статус</th><th>Сумма</th><th>Связаться</th></tr>${l.map(c=>`<tr class="cl" onclick="ecl('${c.id}')"><td>${E(c.name)}</td><td>${E(c.phone)}</td><td><span class="bd" style="background:${SC[c.status]}">${c.status}</span></td><td>${c.sum?M(c.sum):''}</td><td>${c.next||''}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">Пока пусто</td></tr>'}</table>`};
function cl(){return `<h2>Клиенты <button onclick="ecl()">+ Добавить</button><button class="g" onclick="kv=!kv;R()">${kv?'📋 Таблица':'🗂 Доска'}</button></h2><div class="r"><input placeholder="Поиск…" value="${E(q)}" oninput="q=this.value;$('#lst').innerHTML=lst()"><select onchange="sf=this.value;$('#lst').innerHTML=lst()"><option value="">Все статусы</option>${ST.map(s=>`<option ${s==sf?'selected':''}>${s}</option>`).join('')}</select></div><div id="lst">${lst()}</div>`}
function ecl(id){const c=D.clients.find(x=>x.id==id)||{id:'',status:'Новый',auto:true},f=(k,l,t='text')=>`<label>${l}<input id="c_${k}" type="${t}" value="${E(c[k])}"></label>`;
$('#dl').innerHTML=`<h3>${c.id?'Клиент':'Новый клиент'}</h3>${f('name','Имя')}${f('phone','Телефон')}${f('tg','Telegram chat ID (заполняется само)')}${f('src','Источник')}<label>Статус<select id="c_status">${ST.map(s=>`<option ${s==c.status?'selected':''}>${s}</option>`).join('')}</select></label>${f('sum','Сумма сделки','number')}${f('next','Следующий контакт','date')}<label>Заметка<textarea id="c_note">${E(c.note)}</textarea></label><label class="ck"><input type="checkbox" id="c_auto" ${c.auto?'checked':''}> ИИ отвечает сам</label><div class="r"><button onclick="scl('${c.id}')">Сохранить</button>${c.id?`<button class="g" onclick="pay('${c.id}')">💵 Оплата</button><button class="g" onclick="bill('${c.id}')">🟥 Счёт Kaspi</button><button class="g" onclick="cur='${c.id}';tab='chat';$('#dl').close();R()">💬</button><button class="d" onclick="dcl('${c.id}')">🗑</button>`:''}<button class="g" onclick="$('#dl').close()">✕</button></div>`;$('#dl').showModal()}
function scl(id,keep){let c=D.clients.find(x=>x.id==id);if(!c){c={id:uid()};D.clients.push(c)}
['name','phone','tg','src','status','sum','next','note'].forEach(k=>c[k]=$('#c_'+k).value);c.auto=$('#c_auto').checked;save();if(!keep){$('#dl').close();R()}return c}
function pay(id){const c=scl(id,1);if(!+c.sum)return toast('Укажите сумму сделки');D.fin.push({id:uid(),date:td(),type:'in',cat:'Продажа',amt:+c.sum,note:'Оплата: '+c.name,client:c.id});c.status='Оплачен';save();$('#dl').close();toast('Оплата записана в бухгалтерию');R()}
function dcl(id){if(confirm('Удалить клиента и переписку?')){D.clients=D.clients.filter(x=>x.id!=id);delete D.msgs[id];D.del=(D.del||[]).concat(id);save();$('#dl').close();R()}}

const push=(id,r,t)=>(D.msgs[id]=(D.msgs[id]||[]).concat({r,t,ts:Date.now()}));
function chat(){const c=D.clients.find(x=>x.id==cur),ms=c?D.msgs[c.id]||[]:[];
return `<h2>Диалоги</h2><div class="r"><select onchange="cur=this.value;R()"><option value="">— выберите клиента —</option>${D.clients.map(x=>`<option value="${x.id}" ${x.id==cur?'selected':''}>${E(nm(x.id))}</option>`).join('')}</select></div>${c?`<div class="bx" id="bx">${ms.map(m=>`<div class="m ${m.r}">${E(m.t)}<small>${new Date(m.ts).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'})}</small></div>`).join('')}</div><div class="r"><input id="mi" placeholder="Сообщение…" onkeydown="event.key=='Enter'&&snd()"><button class="g" onclick="mic('mi')">🎤</button><button onclick="snd()">Отправить</button><button class="g" onclick="gen()">🤖 Ответ ИИ</button></div>`:'<p class="mu">Выберите клиента. Сообщения из Telegram появятся сами, когда бот включён.</p>'}`}
async function snd(){const c=D.clients.find(x=>x.id==cur),t=$('#mi').value.trim();if(!c||!t)return;push(c.id,'m',t);save();R();try{if(c.tg&&(D.cfg.tg||D.cfg.srv))await tgSend(c.tg,t)}catch(e){toast('Telegram: '+e.message)}}
async function gen(){const c=D.clients.find(x=>x.id==cur);if(!c)return;toast('ИИ думает…');try{await reply(c);R()}catch(e){toast('ИИ: '+e.message)}}
const hist=id=>{let h=(D.msgs[id]||[]).slice(-20).map(m=>({role:m.r=='u'?'user':'assistant',content:m.t}));while(h.length&&h[0].role!='user')h.shift();return h};
async function reply(c){const a=await ai(hist(c.id));push(c.id,'a',a.text);D.cfg.tok+=a.tok;save();if(c.tg&&(D.cfg.tg||D.cfg.srv))await tgSend(c.tg,a.text)}

const em=(r,j)=>{const e=(Array.isArray(j)?j[0]:j)?.error;return (r.status==429?'лимит запросов ИИ (429): подождите минуту или смените модель. ':'')+String(e?.message||r.status).slice(0,220)};
async function ai(h,so){const c=D.cfg,sys=so||[c.prompt,c.rules&&'Правила:\n'+c.rules,c.faq&&'База знаний:\n'+c.faq].filter(Boolean).join('\n\n');
if(c.srv)return await api('/api/ai',{h,so});if(!c.key)throw new Error('нет API-ключа (вкладка «Подключения»)');
if(c.prov=='anthropic'){const r=await fetch(c.url,{method:'POST',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:c.model,max_tokens:800,system:sys,temperature:+c.temp,messages:h})}),j=await r.json();if(!r.ok)throw new Error(em(r,j));return{text:j.content[0].text,tok:j.usage.input_tokens+j.usage.output_tokens}}
const r=await fetch(c.url,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+c.key},body:JSON.stringify({model:c.model,temperature:+c.temp,messages:[{role:'system',content:sys},...h]})}),j=await r.json();
if(!r.ok)throw new Error(em(r,j));return{text:j.choices[0].message.content,tok:j.usage?.total_tokens||0}}
async function tg(m,p){const r=await fetch(`https://api.telegram.org/bot${D.cfg.tg}/${m}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(p||{})}),j=await r.json();if(!j.ok)throw new Error(j.description);return j.result}
const tgSend=(id,text)=>D.cfg.srv?api('/api/send',{id,text}):tg('sendMessage',{chat_id:id,text});
async function inc(m){const id=String(m.chat.id);let c=D.clients.find(x=>x.tg==id);
if(!c){c={id:uid(),name:[m.from?.first_name,m.from?.last_name].filter(Boolean).join(' ')||m.from?.username||id,phone:'',tg:id,src:'Telegram',status:'Новый',sum:'',next:'',note:'',auto:true};D.clients.push(c)}
push(c.id,'u',m.text);save();if(tab!='set'&&tab!='ai')R();
if(D.cfg.auto&&c.auto){try{await reply(c)}catch(e){toast('ИИ: '+e.message)}save();if(tab=='chat'&&cur==c.id)R()}}
async function loop(){while(poll){try{const u=await tg('getUpdates',{timeout:25,offset:D.cfg.off});for(const x of u){D.cfg.off=x.update_id+1;if(x.message?.text)await inc(x.message)}save()}catch(e){await sleep(4000)}}}
async function tgToggle(){if(D.cfg.srv){try{const j=await api('/api/setup',{});toast(j.ok?'Бот подключён к серверу ✅':'Ошибка: '+j.description)}catch(e){toast('Сервер: '+e.message)}return}if(poll){poll=false;R();return}try{const b=await tg('getMe');await tg('deleteWebhook');poll=true;toast('Бот @'+b.username+' запущен. Не закрывайте вкладку');R();loop()}catch(e){toast('Telegram: '+e.message)}}

const TPL={prompt:'Ты — вежливый менеджер компании «НАЗВАНИЕ». Общайся на «вы», коротко и по делу, 1–3 предложения. Выясни потребность клиента, предложи подходящую услугу, веди к заказу. Если клиент готов купить — попроси имя и телефон.',rules:'— Не придумывай цены и сроки, бери только из базы знаний.\n— Если не знаешь ответа — скажи, что уточнишь у менеджера.\n— Не обсуждай политику и конкуренты.',faq:'Услуги и цены:\n— Услуга 1 — 10 000 ₸\n— Услуга 2 — 25 000 ₸\nГрафик работы: пн–сб 9:00–18:00\nАдрес: …'};
function aiTab(){const t=(k,l,r)=>`<label>${l}<textarea rows="${r}" oninput="S('${k}',this.value)">${E(D.cfg[k])}</textarea></label>`;
return `<h2>Настройка ИИ</h2><p class="mu">Опишите, кто такой ИИ, как общаться с клиентами и что можно или нельзя. Эти тексты уходят в ИИ с каждым сообщением.</p>${t('prompt','Роль и стиль общения',7)}${t('rules','Жёсткие правила',4)}${t('faq','База знаний: услуги, цены, вопросы-ответы',8)}<label>Креативность (0–1)<input type="number" step=".1" min="0" max="1" value="${D.cfg.temp}" onchange="S('temp',this.value)"></label><label class="ck"><input type="checkbox" ${D.cfg.auto?'checked':''} onchange="S('auto',this.checked)"> Автоответ клиентам в Telegram</label><div class="r"><button class="g" onclick="Object.assign(D.cfg,TPL);save();R()">Вставить шаблон</button></div><h3>Тест</h3><div class="r"><input id="ti" placeholder="Напишите как клиент…"><button class="g" onclick="mic('ti')">🎤</button><button onclick="tst()">Проверить</button></div><div class="bx" id="to"></div>`}
async function tst(){const o=$('#to');o.textContent='…';try{const a=await ai([{role:'user',content:$('#ti').value||'Здравствуйте!'}]);D.cfg.tok+=a.tok;save();o.textContent=a.text}catch(e){o.textContent='Ошибка: '+e.message}}

function fin(){const f=D.fin.filter(x=>!per||x.date.startsWith(per)).sort((a,b)=>b.date.localeCompare(a.date)),i=sum(f.filter(x=>x.type=='in')),o=sum(f.filter(x=>x.type=='out'));

async function tst0(){try{const a=await ai([{role:'user',content:'Скажи «ок»'}]);toast('ИИ работает: '+a.text.slice(0,40))}catch(e){toast('Ошибка: '+e.message)}}

function imp(f){const r=new FileReader();r.onload=()=>{try{D={...D,...JSON.parse(r.result)};D.cfg={...DEF,...D.cfg};save();R();toast('Данные загружены')}catch(e){toast('Неверный файл')}};r.readAsText(f)}
const COL=['#6366f1','#f59e0b','#0ea5e9','#16a34a','#ec4899','#8b5cf6','#14b8a6','#ef4444'];
const hb=(rows,fmt=x=>x)=>{const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map((r,i)=>`<div class="hb"><span title="${E(r[0])}">${E(r[0])}</span><i style="width:${r[1]/mx*50}%;background:${r[2]||COL[i%8]}"></i><span>${fmt(r[1])}</span></div>`).join('')||'<p class="mu">Нет данных</p>'};
function charts(f,O){const by=(a,k)=>{const m={};a.forEach(x=>m[x[k]||'—']=(m[x[k]||'—']||0)+ +x.amt);return Object.entries(m).sort((a,b)=>b[1]-a[1])},cats=by(O,'cat'),tot=sum(O)||1;let acc=0;

dv=days.map(d=>sum(D.fin.filter(x=>x.type=='in'&&x.date==d))),mx=Math.max(...dv,0),pts=dv.map((v,i)=>`${i*10},${80-v/(mx||1)*70}`).join(' '),
fun=ST.map(s=>[s,D.clients.filter(c=>c.status==s).length,SC[s]]),

top=by(f.filter(x=>x.type=='in'&&x.client).map(x=>({amt:x.amt,c:nm(x.client)})),'c').slice(0,5);
return `<div class="cg"><div class="card"><b>Расходы по категориям</b><div class="r" style="align-items:center;flex-wrap:nowrap"><div class="dn" style="background:conic-gradient(${g||'var(--b) 0 100%'})"></div><div>${cats.map(([k,v],i)=>`<div style="font-size:12px"><b style="color:${COL[i%8]}">●</b> ${E(k)}: ${M(v)}</div>`).join('')||'<span class="mu">Нет расходов</span>'}</div></div></div>
<div class="card"><b>Продажи за 30 дней</b><svg viewBox="0 0 290 90" style="width:100%"><polyline points="${pts}" fill="none" stroke="#16a34a" stroke-width="2"/><polygon points="0,80 ${pts} 290,80" fill="#16a34a" opacity=".15"/></svg><small class="mu">Максимум за день: ${M(mx)}</small></div>
<div class="card"><b>Воронка продаж</b>${hb(fun)}</div><div class="card"><b>Откуда клиенты</b>${hb(src)}</div><div class="card"><b>Топ клиентов по оплатам</b>${hb(top,M)}</div></div>`}
function board(){const l=D.clients.filter(c=>[c.name,c.phone,c.tg,c.note,c.src].join(' ').toLowerCase().includes(q.toLowerCase()));
return `<div class="kb">${ST.map(s=>{const a=l.filter(c=>c.status==s);return `<div ondragover="event.preventDefault()" ondrop="mv(event,'${s}')"><b><span class="bd" style="background:${SC[s]}">${s}</span> ${a.length}</b>${a.map(c=>`<div class="it" draggable="true" ondragstart="event.dataTransfer.setData('t','${c.id}')" onclick="ecl('${c.id}')">${E(c.name)}<br><small class="mu">${c.sum?M(c.sum):''} ${c.next||''}</small></div>`).join('')}</div>`}).join('')}</div>`}

function mic(id){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Голосовой ввод не поддерживается: нужен Chrome, Edge или Safari');const r=new SR(),e=$('#'+id);r.lang='ru-RU';r.onresult=v=>{e.value=(e.value+' '+v.results[0][0].transcript).trim();e.dispatchEvent(new Event('input'))};r.onerror=v=>toast('Микрофон: '+v.error);toast('🎤 Говорите…');r.start()}

return `Ты аналитик CRM. Сегодня ${td()}. Валюта ${D.cfg.cur}. Отвечай по-русски, кратко, только на основе данных ниже; если данных нет — так и скажи.\nКЛИЕНТЫ (имя|тел|статус|сумма|след.контакт|источник|заметка):\n${cl.join('\n')}\nФИНАНСЫ (дата|+приход/-расход|категория|сумма|клиент|заметка):\n${fn.join('\n')}\nПЕРЕПИСКИ:\n${ms.join('\n')}\nТокенов потрачено на ИИ: ${D.cfg.tok}`.slice(0,24000)};
function ask(){return `<h2>Спросить ИИ</h2><p class="mu">ИИ видит клиентов, переписки и бухгалтерию. Например: «кто ещё не оплатил?», «сколько ушло на ИИ в этом месяце?», «кому написать сегодня?»</p><div class="bx" id="bx">${(D.ask||[]).map(m=>`<div class="m ${m.r}">${E(m.t)}</div>`).join('')||'<span class="mu">Задайте вопрос…</span>'}</div><div class="r"><input id="ai_q" placeholder="Вопрос по вашим данным…" onkeydown="event.key=='Enter'&&askGo()"><button class="g" onclick="mic('ai_q')">🎤</button><button onclick="askGo()">Спросить</button><button class="g" onclick="D.ask=[];save();R()">Очистить</button></div><h3>🔍 Поиск по всем данным</h3><div class="r"><input id="sq" placeholder="Имя, телефон, слово из переписки, сумма…" oninput="$('#sr').innerHTML=srch(this.value)"><button class="g" onclick="mic('sq')">🎤</button></div><div id="sr"></div>`}
function askGo(){const t=$('#ai_q').value.trim();if(!t)return;D.ask=(D.ask||[]).concat({r:'u',t});askRun()}
async function askRun(){save();tab='ask';R();toast('Анализирую…');try{let h=D.ask.slice(-10).map(m=>({role:m.r=='u'?'user':'assistant',content:m.t}));while(h.length&&h[0].role!='user')h.shift();const a=await ai(h,ctx());D.cfg.tok+=a.tok;D.ask.push({r:'a',t:a.text})}catch(e){D.ask.push({r:'a',t:'Ошибка: '+e.message})}save();R()}
function srch(q){q=q.trim().toLowerCase();if(q.length<2)return '';const h=a=>a.join(' ').toLowerCase().includes(q),
c=D.clients.filter(x=>h([x.name,x.phone,x.tg,x.note,x.src,x.status])).map(x=>`<div class="card sc" onclick="ecl('${x.id}')">👤 ${E(x.name)} · ${x.status} ${E(x.phone)}</div>`),
m=Object.entries(D.msgs).flatMap(([id,a])=>a.filter(x=>h([x.t])).map(x=>`<div class="card sc" onclick="cur='${id}';go('chat')">💬 <b>${E(nm(id))}</b>: ${E(x.t.slice(0,140))}</div>`)).slice(0,20),
f=D.fin.filter(x=>h([x.cat,x.note,nm(x.client),x.amt,x.date])).slice(0,20).map(x=>`<div class="card sc">💰 ${x.date} ${x.type=='in'?'+':'−'}${M(x.amt)} ${E(x.cat)} ${E(x.note)}</div>`);

async function bill(id){const c=scl(id,1),a=+c.sum;if(!a)return toast('Укажите сумму сделки');const k=D.cfg,v={id:uid(),date:td(),client:c.id,amt:a,status:'wait',link:k.kLink.replace('{sum}',a)};

const t=`Счёт на ${M(a)}.`+(v.link?'\nОплатить в Kaspi: '+v.link:'')+(k.kPhone?'\nИли переводом на Kaspi: '+k.kPhone:'')+'\nПосле оплаты пришлите, пожалуйста, чек.';
D.inv.push(v);push(c.id,'m',t);save();let m='Счёт создан';try{if(c.tg&&(k.tg||k.srv)){await tgSend(c.tg,t);m+=' и отправлен в Telegram'}else{await navigator.clipboard.writeText(t);m+=', текст скопирован'}}catch(e){}
$('#dl').close();toast(m);R()}
const invs=()=>`<h3>🟥 Счета Kaspi <button class="g" onclick="chk()">🔄 Проверить оплаты</button></h3><table><tr><th>Дата</th><th>Клиент</th><th>Сумма</th><th>Статус</th><th></th></tr>${[...D.inv].reverse().map(v=>`<tr><td>${v.date}</td><td>${E(nm(v.client))}</td><td>${M(v.amt)}</td><td>${v.status=='paid'?'✅ оплачен':'⏳ ждёт'}</td><td>${v.status=='paid'?'':`<a style="cursor:pointer" onclick="ipay('${v.id}')">✔ Оплачен</a>`}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">Счетов пока нет</td></tr>'}</table><p class="mu">Сервер Kaspi должен отвечать на <b>POST /invoice</b> {id, amount, name, phone} → {link} и <b>GET /status?id=…</b> → {paid:true|false}.</p>`;

let dirty=0,tm;

const pub=()=>({...D,cfg:{...D.cfg,srv:'',srvKey:'',key:'',tg:'',off:0},fin:D.fin.map(({img,...x})=>x)});

localStorage.setItem('crm',JSON.stringify(D));if(b!=sg()&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$('#dl').open)R()}catch(e){}}
setInterval(()=>{if(!document.hidden)pull()},8000);
const V={dash,cl,chat,ask,ai:aiTab,fin,set};R();pull();
